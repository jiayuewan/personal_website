[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.167.0"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Old CV links (e.g. shared before an update) point to the current CV.
[[redirects]]
  from = "/uploads/CV_JIAYUE_WAN_AUG_2025.pdf"
  to = "/uploads/CV_JIAYUE_WAN_JUN_2026.pdf"
  status = 301
